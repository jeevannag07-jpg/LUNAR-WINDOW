version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lunar-window-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - LUNAR_DEBUG=false
      - LUNAR_CORS_ORIGINS=["http://localhost","http://localhost:5173","http://localhost:80"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lunar-window-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
